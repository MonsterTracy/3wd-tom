name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[tom,dev]"
      - name: Compile Python sources
        run: python -m compileall script werewolf tests
      - name: Run self-contained test suite
        run: python -m pytest -q
