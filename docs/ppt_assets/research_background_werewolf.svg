<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">研究背景：狼人杀中的多轮信念推理问题</title>
  <desc id="desc">四宫格中文研究背景图，说明狼人杀任务特性、传统 LLM Agent 的不足、本项目研究目标，以及引入三支决策表示不确定性的动机。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#16a34a"/>
    </marker>
    <style>
      .font { font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", "Noto Sans CJK SC", sans-serif; }
      .bg { fill: #ffffff; }
      .page-title { font: 700 44px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #111827; letter-spacing: 0; }
      .page-subtitle { font: 400 21px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #4b5563; letter-spacing: 0; }
      .panel { fill: #ffffff; stroke: #d7dee8; stroke-width: 2; }
      .panel-title { font: 700 25px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #111827; letter-spacing: 0; }
      .panel-letter { font: 700 18px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #ffffff; letter-spacing: 0; }
      .body { font: 400 18px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #374151; letter-spacing: 0; }
      .small { font: 400 15px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #4b5563; letter-spacing: 0; }
      .tiny { font: 500 13px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #374151; letter-spacing: 0; }
      .summary { font: 600 17px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #111827; letter-spacing: 0; }
      .box-text { font: 600 16px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #111827; letter-spacing: 0; }
      .label { font: 600 14px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; letter-spacing: 0; }
      .blue-fill { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .purple-fill { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.5; }
      .green-fill { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; }
      .red-fill { fill: #fff1f2; stroke: #fca5a5; stroke-width: 1.5; }
      .orange-fill { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; }
      .neutral-fill { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.3; }
      .blue { fill: #2563eb; }
      .purple { fill: #7c3aed; }
      .green { fill: #16a34a; }
      .red { fill: #dc2626; }
      .orange { fill: #f97316; }
      .blue-stroke { stroke: #2563eb; }
      .purple-stroke { stroke: #7c3aed; }
      .green-stroke { stroke: #16a34a; }
      .red-stroke { stroke: #dc2626; }
      .orange-stroke { stroke: #f97316; }
      .arrow-blue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); stroke-linecap: round; }
      .arrow-purple { stroke: #7c3aed; stroke-width: 3; fill: none; marker-end: url(#arrow-purple); stroke-linecap: round; }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); stroke-linecap: round; }
      .thin { stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="page-title" x="800" y="58" text-anchor="middle">研究背景：狼人杀中的多轮信念推理问题</text>
  <text class="page-subtitle" x="800" y="93" text-anchor="middle">从社会推理任务到 observer-conditioned belief modeling 与三支不确定决策</text>

  <!-- Panel A -->
  <g transform="translate(70 125)">
    <rect class="panel" x="0" y="0" width="705" height="335" rx="10"/>
    <rect x="0" y="0" width="705" height="8" rx="4" fill="#2563eb"/>
    <circle cx="38" cy="43" r="19" fill="#2563eb"/>
    <text class="panel-letter" x="38" y="50" text-anchor="middle">(a)</text>
    <text class="panel-title" x="72" y="51">狼人杀任务特性</text>

    <!-- simplified cartoon icon: table, players, speech, mask, vote box -->
    <g transform="translate(48 98) scale(0.72)">
      <ellipse cx="154" cy="92" rx="116" ry="58" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
      <ellipse cx="154" cy="92" rx="60" ry="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
      <g fill="#ffffff" stroke="#2563eb" stroke-width="2">
        <circle cx="154" cy="12" r="20"/>
        <circle cx="70" cy="58" r="20"/>
        <circle cx="238" cy="58" r="20"/>
        <circle cx="96" cy="158" r="20"/>
        <circle cx="212" cy="158" r="20"/>
      </g>
      <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
        <path d="M132 41 Q154 58 176 41"/>
        <path d="M48 87 Q70 103 92 87"/>
        <path d="M216 87 Q238 103 260 87"/>
        <path d="M74 187 Q96 202 118 187"/>
        <path d="M190 187 Q212 202 234 187"/>
      </g>
      <path d="M300 23 H384 C398 23 408 33 408 47 V65 C408 79 398 89 384 89 H348 L326 111 V89 H300 C286 89 276 79 276 65 V47 C276 33 286 23 300 23 Z" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text class="tiny" x="342" y="54" text-anchor="middle">公开发言</text>
      <text class="tiny" x="342" y="75" text-anchor="middle">站边 / 辩解</text>
      <path d="M330 135 C352 120 388 120 410 135 C408 165 391 185 370 185 C349 185 332 165 330 135 Z" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <path d="M345 148 C353 142 361 142 369 148 M374 148 C382 142 390 142 398 148" class="thin blue-stroke"/>
      <path d="M355 168 Q370 176 385 168" class="thin blue-stroke"/>
      <text class="tiny" x="370" y="211" text-anchor="middle">欺骗与博弈</text>
      <rect x="455" y="130" width="88" height="66" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <path d="M470 130 L499 107 L528 130" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <rect x="480" y="150" width="38" height="8" rx="3" fill="#2563eb"/>
      <text class="tiny" x="499" y="219" text-anchor="middle">投票出局</text>
    </g>

    <g transform="translate(458 82)">
      <rect class="blue-fill" x="0" y="0" width="192" height="32" rx="8"/>
      <text class="body" x="18" y="22">隐藏身份</text>
      <rect class="blue-fill" x="0" y="38" width="192" height="32" rx="8"/>
      <text class="body" x="18" y="60">私有信息</text>
      <rect class="blue-fill" x="0" y="76" width="192" height="32" rx="8"/>
      <text class="body" x="18" y="98">公开发言</text>
      <rect class="orange-fill" x="0" y="114" width="192" height="32" rx="8"/>
      <text class="body" x="18" y="136">欺骗与博弈</text>
      <rect class="blue-fill" x="0" y="152" width="192" height="32" rx="8"/>
      <text class="body" x="18" y="174">多轮投票与出局</text>
    </g>

    <rect x="38" y="280" width="629" height="36" rx="8" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1.3"/>
    <text class="summary" x="352" y="304" text-anchor="middle">狼人杀是一个包含不完全信息、语言博弈与多轮决策的社会推理任务。</text>
  </g>

  <!-- Panel B -->
  <g transform="translate(825 125)">
    <rect class="panel" x="0" y="0" width="705" height="335" rx="10"/>
    <rect x="0" y="0" width="705" height="8" rx="4" fill="#7c3aed"/>
    <circle cx="38" cy="43" r="19" fill="#7c3aed"/>
    <text class="panel-letter" x="38" y="50" text-anchor="middle">(b)</text>
    <text class="panel-title" x="72" y="51">传统 LLM Agent</text>

    <g transform="translate(42 102)">
      <rect class="purple-fill" x="0" y="0" width="132" height="58" rx="8"/>
      <text class="box-text" x="66" y="25" text-anchor="middle">可见上下文</text>
      <text class="small" x="66" y="45" text-anchor="middle">history</text>
      <path class="arrow-purple" d="M142 29 L190 29"/>

      <rect class="purple-fill" x="200" y="0" width="112" height="58" rx="8"/>
      <text class="box-text" x="256" y="36" text-anchor="middle">Prompt</text>
      <path class="arrow-purple" d="M322 29 L370 29"/>

      <rect class="purple-fill" x="380" y="0" width="96" height="58" rx="8"/>
      <text class="box-text" x="428" y="36" text-anchor="middle">LLM</text>
      <path class="arrow-purple" d="M486 29 L534 29"/>

      <rect class="purple-fill" x="544" y="0" width="118" height="58" rx="8"/>
      <text class="box-text" x="603" y="25" text-anchor="middle">发言 / 投票</text>
      <text class="small" x="603" y="45" text-anchor="middle">action</text>
    </g>

    <g transform="translate(60 188)">
      <rect x="0" y="0" width="585" height="105" rx="10" fill="#fff1f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
      <text class="label red" x="22" y="30">主要不足</text>
      <g transform="translate(22 48)">
        <circle cx="5" cy="0" r="4" fill="#dc2626"/>
        <text class="body" x="20" y="7">缺少显式 belief state</text>
        <circle cx="287" cy="0" r="4" fill="#dc2626"/>
        <text class="body" x="302" y="7">信息混杂</text>
        <circle cx="5" cy="38" r="4" fill="#dc2626"/>
        <text class="body" x="20" y="45">难以维护多轮怀疑</text>
        <circle cx="287" cy="38" r="4" fill="#dc2626"/>
        <text class="body" x="302" y="45">难以处理不确定判断</text>
      </g>
    </g>
  </g>

  <!-- Panel C -->
  <g transform="translate(70 505)">
    <rect class="panel" x="0" y="0" width="705" height="335" rx="10"/>
    <rect x="0" y="0" width="705" height="8" rx="4" fill="#16a34a"/>
    <circle cx="38" cy="43" r="19" fill="#16a34a"/>
    <text class="panel-letter" x="38" y="50" text-anchor="middle">(c)</text>
    <text class="panel-title" x="72" y="51">本项目研究目标</text>

    <g transform="translate(42 100)">
      <rect class="green-fill" x="0" y="0" width="188" height="72" rx="10"/>
      <text class="box-text" x="94" y="26" text-anchor="middle">structured claims</text>
      <text class="small" x="94" y="50" text-anchor="middle">observer 可见 game_log</text>
      <path class="arrow-green" d="M198 36 L246 36"/>

      <rect class="green-fill" x="256" y="0" width="174" height="72" rx="10"/>
      <text class="box-text" x="343" y="26" text-anchor="middle">ToM belief model</text>
      <text class="small" x="343" y="50" text-anchor="middle">动态信念建模</text>
      <path class="arrow-green" d="M440 36 L488 36"/>

      <rect class="green-fill" x="498" y="0" width="164" height="72" rx="10"/>
      <text class="box-text" x="580" y="26" text-anchor="middle">wolf probability</text>
      <text class="small" x="580" y="50" text-anchor="middle">[p1, ..., p7]</text>
    </g>

    <g transform="translate(66 186)">
      <rect x="0" y="0" width="250" height="38" rx="19" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <circle cx="27" cy="19" r="7" fill="#16a34a"/>
      <text class="body" x="50" y="26">observer-conditioned</text>

      <rect x="0" y="48" width="290" height="38" rx="19" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
      <circle cx="27" cy="67" r="7" fill="#16a34a"/>
      <text class="body" x="50" y="74">每轮发言后动态更新</text>
    </g>

    <g transform="translate(498 184)">
      <text class="tiny" x="0" y="-8">狼概率示意</text>
      <g>
        <text class="tiny" x="0" y="17">P2</text>
        <rect x="32" y="5" width="115" height="13" rx="4" fill="#dcfce7"/>
        <rect x="32" y="5" width="83" height="13" rx="4" fill="#16a34a"/>
      </g>
      <g transform="translate(0 25)">
        <text class="tiny" x="0" y="17">P5</text>
        <rect x="32" y="5" width="115" height="13" rx="4" fill="#dcfce7"/>
        <rect x="32" y="5" width="58" height="13" rx="4" fill="#16a34a"/>
      </g>
      <g transform="translate(0 50)">
        <text class="tiny" x="0" y="17">P7</text>
        <rect x="32" y="5" width="115" height="13" rx="4" fill="#dcfce7"/>
        <rect x="32" y="5" width="29" height="13" rx="4" fill="#16a34a"/>
      </g>
    </g>

    <rect x="38" y="280" width="629" height="36" rx="8" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1.3"/>
    <text class="summary" x="352" y="304" text-anchor="middle">基于当前观察者可见信息，动态估计其对各玩家的狼人信念。</text>
  </g>

  <!-- Panel D -->
  <g transform="translate(825 505)">
    <rect class="panel" x="0" y="0" width="705" height="335" rx="10"/>
    <rect x="0" y="0" width="705" height="8" rx="4" fill="#f97316"/>
    <circle cx="38" cy="43" r="19" fill="#f97316"/>
    <text class="panel-letter" x="38" y="50" text-anchor="middle">(d)</text>
    <text class="panel-title" x="72" y="51">引入三支决策的动机</text>

    <g transform="translate(60 100)">
      <rect x="0" y="0" width="170" height="112" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
      <circle cx="85" cy="33" r="18" fill="#16a34a"/>
      <text class="panel-letter" x="85" y="40" text-anchor="middle">POS</text>
      <text class="box-text" x="85" y="76" text-anchor="middle">高确信怀疑</text>
      <text class="small" x="85" y="99" text-anchor="middle">倾向采取行动</text>

      <rect x="207" y="0" width="170" height="112" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <circle cx="292" cy="33" r="18" fill="#f97316"/>
      <text class="panel-letter" x="292" y="40" text-anchor="middle">BND</text>
      <text class="box-text" x="292" y="76" text-anchor="middle">暂不确定</text>
      <text class="small" x="292" y="99" text-anchor="middle">继续观察</text>

      <rect x="414" y="0" width="170" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <circle cx="499" cy="33" r="18" fill="#2563eb"/>
      <text class="panel-letter" x="499" y="40" text-anchor="middle">NEG</text>
      <text class="box-text" x="499" y="76" text-anchor="middle">低确信怀疑</text>
      <text class="small" x="499" y="99" text-anchor="middle">暂不优先怀疑</text>
    </g>

    <g transform="translate(98 244)">
      <line x1="0" y1="0" x2="510" y2="0" stroke="#e5e7eb" stroke-width="8" stroke-linecap="round"/>
      <circle cx="30" cy="0" r="10" fill="#2563eb"/>
      <circle cx="255" cy="0" r="10" fill="#f97316"/>
      <circle cx="480" cy="0" r="10" fill="#16a34a"/>
      <text class="tiny" x="30" y="26" text-anchor="middle">低怀疑</text>
      <text class="tiny" x="255" y="26" text-anchor="middle">边界不确定</text>
      <text class="tiny" x="480" y="26" text-anchor="middle">高怀疑</text>
    </g>

    <rect x="38" y="280" width="629" height="36" rx="8" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1.3"/>
    <text class="summary" x="352" y="304" text-anchor="middle">狼人杀中的判断并非总是二元确定，需要显式表示不确定性。</text>
  </g>
</svg>
