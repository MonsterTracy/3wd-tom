<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">从大模型到社会推理 Agent</title>
  <desc id="desc">一页中文 PPT 背景图，展示 LLM 到 Agent 能力扩展、多智能体文本交互、社会推理决策的递进流程，并总结语言生成、多轮交互、信念建模和决策智能四类能力。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 12 7 L 1 13 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-grayblue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 12 7 L 1 13 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 800 46px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #111827; letter-spacing: 0; }
      .subtitle { font: 400 20px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #4b5563; letter-spacing: 0; }
      .module-title { font: 700 26px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #111827; letter-spacing: 0; }
      .module-sub { font: 400 18px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #4b5563; letter-spacing: 0; }
      .label { font: 600 15px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #374151; letter-spacing: 0; }
      .right-title { font: 700 24px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #111827; letter-spacing: 0; }
      .right-sub { font: 400 17px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #4b5563; letter-spacing: 0; }
      .card-title { font: 700 23px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; letter-spacing: 0; }
      .card-sub { font: 400 17px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #374151; letter-spacing: 0; }
      .summary { font: 600 22px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #111827; letter-spacing: 0; }
      .small { font: 500 14px "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "STHeiti", sans-serif; fill: #4b5563; letter-spacing: 0; }
      .chip-text { font: 800 34px "Arial", "Helvetica", sans-serif; fill: #1e3a8a; letter-spacing: 0; }
      .blue { fill: #2563eb; }
      .green { fill: #16a34a; }
      .purple { fill: #7c3aed; }
      .orange { fill: #f59e0b; }
      .blue-text { fill: #1e3a8a; }
      .green-text { fill: #166534; }
      .purple-text { fill: #4c1d95; }
      .orange-text { fill: #92400e; }
      .blue-box { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .green-box { fill: #f0fdf4; stroke: #86efac; stroke-width: 2; }
      .purple-box { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 2; }
      .orange-box { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; }
      .neutral-box { fill: #ffffff; stroke: #d6dee8; stroke-width: 2; }
      .flow-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .flow-blue { fill: #f8fbff; stroke: #93c5fd; stroke-width: 2; }
      .flow-green { fill: #f7fff9; stroke: #86efac; stroke-width: 2; }
      .flow-purple { fill: #fbf9ff; stroke: #c4b5fd; stroke-width: 2; }
      .flow-orange { fill: #fffaf2; stroke: #fdba74; stroke-width: 2; }
      .dash-blue { fill: #ffffff; stroke: #2563eb; stroke-width: 2.2; stroke-dasharray: 9 7; }
      .dash-green { fill: #ffffff; stroke: #16a34a; stroke-width: 2.2; stroke-dasharray: 9 7; }
      .dash-purple { fill: #ffffff; stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 9 7; }
      .arrow { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrow-blue); stroke-linecap: round; stroke-linejoin: round; }
      .arrow-gray { stroke: #64748b; stroke-width: 3.5; fill: none; marker-end: url(#arrow-grayblue); stroke-linecap: round; stroke-linejoin: round; }
      .icon { fill: none; stroke: #111827; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-blue { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-green { fill: none; stroke: #16a34a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-purple { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-orange { fill: none; stroke: #f59e0b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="800" y="64" text-anchor="middle">从大模型到社会推理 Agent</text>
  <text class="subtitle" x="800" y="99" text-anchor="middle">文本理解与生成能力进一步扩展为多轮交互、信念更新和稳健决策能力</text>

  <!-- Main vertical evolution flow -->
  <g id="main-flow" transform="translate(92 124)">
    <!-- Layer 1: LLM -->
    <g transform="translate(170 0)">
      <rect class="flow-blue" x="0" y="0" width="620" height="110" rx="18"/>
      <g transform="translate(34 22)">
        <rect x="0" y="0" width="68" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
        <rect x="14" y="14" width="40" height="40" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
        <path class="icon-blue" d="M-10 16 H0 M-10 34 H0 M-10 52 H0 M68 16 H78 M68 34 H78 M68 52 H78 M16 -10 V0 M34 -10 V0 M52 -10 V0 M16 68 V78 M34 68 V78 M52 68 V78"/>
      </g>
      <text class="chip-text" x="250" y="45" text-anchor="middle">LLM</text>
      <text class="module-sub" x="250" y="75" text-anchor="middle">文本理解 / 语言生成</text>
      <text class="small" x="472" y="47" text-anchor="middle">语言能力基础</text>
      <text class="small" x="472" y="72" text-anchor="middle">从文本中抽取与表达信息</text>
    </g>

    <path class="arrow" d="M480 118 L480 142"/>

    <!-- Layer 2: Agent capability -->
    <g transform="translate(170 150)">
      <rect class="flow-green" x="0" y="0" width="620" height="120" rx="18"/>
      <g transform="translate(52 28)">
        <circle cx="42" cy="35" r="28" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
        <circle cx="32" cy="29" r="4" fill="#111827"/>
        <circle cx="52" cy="29" r="4" fill="#111827"/>
        <path class="icon" d="M29 46 Q42 55 55 46"/>
        <path class="icon-green" d="M13 77 C18 60 66 60 71 77"/>
      </g>
      <text class="module-title" x="310" y="44" text-anchor="middle">Agent 能力扩展</text>
      <text class="module-sub" x="310" y="65" text-anchor="middle">将语言模型接入状态维护、推理规划与行动选择</text>

      <g transform="translate(150 98)">
        <circle cx="0" cy="0" r="15" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
        <text class="label" x="0" y="5" text-anchor="middle">记忆</text>
      </g>
      <g transform="translate(260 98)">
        <circle cx="0" cy="0" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
        <text class="label" x="0" y="5" text-anchor="middle">推理</text>
      </g>
      <g transform="translate(370 98)">
        <circle cx="0" cy="0" r="15" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
        <text class="label" x="0" y="5" text-anchor="middle">规划</text>
      </g>
      <g transform="translate(480 98)">
        <circle cx="0" cy="0" r="15" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
        <text class="label" x="0" y="5" text-anchor="middle">决策</text>
      </g>
    </g>

    <path class="arrow" d="M480 278 L480 294"/>

    <!-- Layer 3: multi-agent text interaction -->
    <g transform="translate(170 302)">
      <rect class="flow-purple" x="0" y="0" width="620" height="142" rx="18"/>
      <text class="module-title" x="310" y="34" text-anchor="middle">多智能体文本交互</text>
      <text class="module-sub" x="310" y="62" text-anchor="middle">多个 Agent 通过公开发言持续交换信息</text>

      <g transform="translate(74 70)">
        <circle cx="24" cy="22" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
        <path class="icon-blue" d="M0 63 C4 45 44 45 48 63"/>
        <path class="icon-blue" d="M53 0 H112 C121 0 128 7 128 16 V35 C128 44 121 51 112 51 H85 L68 66 V51 H53 C44 51 37 44 37 35 V16 C37 7 44 0 53 0 Z"/>
        <text class="small" x="82" y="31" text-anchor="middle">发言</text>
      </g>
      <g transform="translate(268 70)">
        <circle cx="24" cy="22" r="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
        <path class="icon-green" d="M0 63 C4 45 44 45 48 63"/>
        <path class="icon-green" d="M53 0 H112 C121 0 128 7 128 16 V35 C128 44 121 51 112 51 H85 L68 66 V51 H53 C44 51 37 44 37 35 V16 C37 7 44 0 53 0 Z"/>
        <text class="small" x="82" y="31" text-anchor="middle">...</text>
      </g>
      <g transform="translate(462 70)">
        <circle cx="24" cy="22" r="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
        <path class="icon-orange" d="M0 63 C4 45 44 45 48 63"/>
        <path class="icon-orange" d="M53 0 H112 C121 0 128 7 128 16 V35 C128 44 121 51 112 51 H85 L68 66 V51 H53 C44 51 37 44 37 35 V16 C37 7 44 0 53 0 Z"/>
        <text class="small" x="82" y="31" text-anchor="middle">发言</text>
      </g>
      <path class="arrow-gray" d="M215 101 L252 101"/>
      <path class="arrow-gray" d="M409 101 L446 101"/>
    </g>

    <path class="arrow" d="M480 452 L480 460"/>

    <!-- Layer 4: social reasoning decision -->
    <g transform="translate(170 468)">
      <rect class="flow-orange" x="0" y="0" width="620" height="106" rx="18"/>
      <g transform="translate(46 24)">
        <circle cx="29" cy="29" r="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/>
        <path class="icon-orange" d="M29 8 V50 M11 25 H47 M15 25 L6 44 H24 Z M43 25 L34 44 H52 Z"/>
      </g>
      <text class="module-title" x="320" y="42" text-anchor="middle">社会推理决策</text>
      <text class="module-sub" x="320" y="74" text-anchor="middle">身份判断 / 信任评估 / 意图预测 / 行动选择</text>
    </g>
  </g>

  <!-- Right dashed explanatory boxes -->
  <g id="right-notes" transform="translate(1048 152)">
    <g>
      <rect class="dash-blue" x="0" y="0" width="480" height="134" rx="18"/>
      <g transform="translate(42 36)">
        <path class="icon-blue" d="M0 10 C0 4 6 0 14 0 H78 C86 0 92 6 92 14 V44 C92 52 86 58 78 58 H51 L31 75 V58 H14 C6 58 0 52 0 44 Z"/>
        <circle cx="26" cy="29" r="3" fill="#2563eb"/>
        <circle cx="44" cy="29" r="3" fill="#2563eb"/>
        <circle cx="62" cy="29" r="3" fill="#2563eb"/>
      </g>
      <text class="right-title" x="176" y="47">语言能力基础</text>
      <text class="right-sub" x="176" y="80">LLM 支持文本理解、生成与角色扮演</text>
    </g>

    <g transform="translate(0 158)">
      <rect class="dash-green" x="0" y="0" width="480" height="134" rx="18"/>
      <g transform="translate(46 35)">
        <path class="icon-green" d="M62 14 C49 2 29 1 15 13 C2 25 0 45 11 59"/>
        <path class="icon-green" d="M62 14 L62 0 L76 2"/>
        <path class="icon-green" d="M14 58 C27 72 49 73 64 60 C77 48 78 29 69 16"/>
        <path class="icon-green" d="M14 58 L14 73 L0 71"/>
        <circle cx="39" cy="36" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      </g>
      <text class="right-title" x="176" y="47">Agent 能力扩展</text>
      <text class="right-sub" x="176" y="80">在多轮交互中维护状态、推理规划并选择行动</text>
    </g>

    <g transform="translate(0 316)">
      <rect class="dash-purple" x="0" y="0" width="480" height="134" rx="18"/>
      <g transform="translate(48 33)">
        <circle cx="26" cy="22" r="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
        <path class="icon-purple" d="M2 63 C6 45 46 45 50 63"/>
        <circle cx="86" cy="22" r="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
        <path class="icon-purple" d="M62 63 C66 45 106 45 110 63"/>
        <path class="icon-purple" d="M48 18 C60 5 72 5 84 18"/>
        <path class="icon-purple" d="M54 42 C64 52 74 52 84 42"/>
      </g>
      <text class="right-title" x="176" y="47">社会推理挑战</text>
      <text class="right-sub" x="176" y="80">需要建模他人信念、策略意图与不确定状态</text>
    </g>
  </g>

  <!-- Summary sentence -->
  <g transform="translate(118 704)">
    <rect x="0" y="0" width="1364" height="44" rx="10" fill="#f8fafc" stroke="#dbe3ef" stroke-width="1.5"/>
    <rect x="0" y="0" width="8" height="44" rx="4" fill="#2563eb"/>
    <text class="summary" x="682" y="29" text-anchor="middle">社会推理 Agent 的核心不只是“会说话”，而是能在多轮文本交互中持续更新信念并做出稳健决策。</text>
  </g>

  <!-- Bottom function cards -->
  <g id="bottom-cards" transform="translate(96 768)">
    <g>
      <rect class="blue-box" x="0" y="0" width="340" height="94" rx="12"/>
      <circle cx="58" cy="47" r="34" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <path class="icon-blue" d="M34 35 C34 27 42 22 52 22 H84 C94 22 102 30 102 40 V53 C102 63 94 70 84 70 H66 L53 81 V70 H52 C42 70 34 63 34 53 Z"/>
      <text class="card-title blue-text" x="138" y="39">语言生成</text>
      <text class="card-sub" x="138" y="68">自然语言表达与理解</text>
    </g>

    <g transform="translate(362 0)">
      <rect class="green-box" x="0" y="0" width="340" height="94" rx="12"/>
      <circle cx="58" cy="47" r="34" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
      <path class="icon-green" d="M74 31 C63 19 43 20 34 34 C25 47 29 64 42 72"/>
      <path class="icon-green" d="M74 31 L74 19 L87 22"/>
      <path class="icon-green" d="M42 72 C55 82 74 78 82 64 C90 50 86 36 75 29"/>
      <path class="icon-green" d="M42 72 L42 84 L29 81"/>
      <text class="card-title green-text" x="138" y="39">多轮交互</text>
      <text class="card-sub" x="138" y="68">连续发言与上下文维护</text>
    </g>

    <g transform="translate(724 0)">
      <rect class="purple-box" x="0" y="0" width="340" height="94" rx="12"/>
      <circle cx="58" cy="47" r="34" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
      <circle cx="44" cy="35" r="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <circle cx="72" cy="35" r="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <circle cx="58" cy="63" r="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <path class="icon-purple" d="M50 40 L55 57 M66 40 L61 57 M49 63 H51 M65 63 H67"/>
      <text class="card-title purple-text" x="138" y="39">信念建模</text>
      <text class="card-sub" x="138" y="68">推断身份、立场与意图</text>
    </g>

    <g transform="translate(1086 0)">
      <rect class="orange-box" x="0" y="0" width="340" height="94" rx="12"/>
      <circle cx="58" cy="47" r="34" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
      <path class="icon-orange" d="M58 23 V69 M35 46 H81"/>
      <circle cx="58" cy="46" r="22" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <circle cx="58" cy="46" r="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
      <text class="card-title orange-text" x="138" y="39">决策智能</text>
      <text class="card-sub" x="138" y="68">基于推理结果选择行动</text>
    </g>
  </g>
</svg>
