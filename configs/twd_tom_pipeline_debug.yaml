backends:
  deepseek:
    type: openai_compatible
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"

parser:
  backend: deepseek
  model: "deepseek-v4-flash"
  model_params:
    temperature: 0.0

env_config:
  n_player: 7
  n_role: 4
  n_werewolf: 2
  n_seer: 1
  n_guard: 0
  n_witch: 1
  n_hunter: 0
  n_villager: 3

agent_config:
  allow_cross_team_profiles: true
  must_include: []
  all_candidates:
    - profile_name: deepseek_debug
      agent_type: deepseek
      backend: deepseek
      model: "deepseek-v4-flash"
      model_params:
        temperature: 1.0
      sample_ratio: 1.0

pipeline:
  public_event_schema_version: classic7_public_event_sequence_v1
  raw_schema_version: classic7_pre_speech_player_suspicion_v2
  projected_schema_version: classic7_pre_speech_suspicion_pair_distribution_v2
  projection_version: classic7_player_suspicion_pair_projection_base2_v1

  collection:
    game_count: 3
    seeds: [3101, 3102, 3103]
    max_gameplay_calls_per_game: 96
    max_belief_calls_per_game: 224
    max_total_calls_per_game: 320
    max_wall_seconds_per_game: 3600.0

  project: {}

  split:
    seed: 42
    train_game_count: 1
    validation_game_count: 1
    test_game_count: 1

  train:
    epochs: 1
    batch_size: 2
    learning_rate: 0.001
    weight_decay: 0.0
    seed: 42
    device: cpu
    num_workers: 0
    gradient_clip_norm: 1.0
    early_stopping_patience: 2
    early_stopping_min_delta: 0.0
    d_model: 8
    n_head: 2
    n_layer: 1
    dropout: 0.0
    max_seq_len: 8
    dim_feedforward: 16

  eval:
    batch_size: 2
    device: cpu
    num_workers: 0
    allow_game_id_overlap: false
