backends:
  deepseek:
    type: openai_compatible
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"

parser:
  backend: deepseek
  model: "deepseek-v4-flash"
  model_params:
    temperature: 0.0

env_config:
  n_player: 7
  n_role: 4
  n_werewolf: 2
  n_seer: 1
  n_guard: 0
  n_witch: 1
  n_hunter: 0
  n_villager: 3

agent_config:
  allow_cross_team_profiles: true
  must_include: []
  all_candidates:
    - profile_name: deepseek_debug
      agent_type: deepseek
      backend: deepseek
      model: "deepseek-v4-flash"
      model_params:
        temperature: 1.0
      sample_ratio: 1.0

pipeline:
  public_event_schema_version: classic7_public_event_sequence_v1
  raw_schema_version: classic7_fixed_two_wolves_actor_perspective_direct_pair_belief_self_reports_v1

  collection:
    game_count: 3
    seeds: [3101, 3102, 3103]
    max_gameplay_calls_per_game: 96
    max_belief_calls_per_game: 224
    max_total_calls_per_game: 320
    max_wall_seconds_per_game: 3600.0
