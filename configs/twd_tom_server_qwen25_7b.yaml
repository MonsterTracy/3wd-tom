backends:
  server_qwen25_7b:
    type: openai_compatible
    base_url: "http://127.0.0.1:8000/v1"
    default_model: "qwen2.5-7b-instruct"
    supports_json_schema: true

parser:
  backend: server_qwen25_7b
  model: "qwen2.5-7b-instruct"
  model_params:
    temperature: 0.0

env_config:
  n_player: 7
  n_role: 4
  n_werewolf: 2
  n_seer: 1
  n_guard: 0
  n_witch: 1
  n_hunter: 0
  n_villager: 3

agent_config:
  allow_cross_team_profiles: true
  must_include: []
  all_candidates:
    - profile_name: server_qwen25_7b
      agent_type: gpt
      backend: server_qwen25_7b
      model: "qwen2.5-7b-instruct"
      model_params:
        temperature: 1.0
        gameplay_prompt_profile: strict_classic7
        gameplay_max_tokens: 512
      sample_ratio: 1.0

pipeline:
  public_event_schema_version: classic7_public_event_sequence_v1
  raw_schema_version: classic7_fixed_two_wolves_actor_perspective_direct_pair_belief_self_reports_v1

  collection:
    game_count: 3
    seeds: [4101, 4102, 4103]
    max_gameplay_calls_per_game: 96
    max_belief_calls_per_game: 224
    max_total_calls_per_game: 320
    max_wall_seconds_per_game: 3600.0
