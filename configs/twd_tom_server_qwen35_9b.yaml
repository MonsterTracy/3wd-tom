backends:
  server_qwen35_9b:
    type: openai_compatible
    base_url: "http://127.0.0.1:8000/v1"
    default_model: "qwen3.5-9b"
    supports_json_schema: true

parser:
  backend: server_qwen35_9b
  model: "qwen3.5-9b"
  model_params:
    temperature: 0.0

env_config:
  n_player: 7
  n_role: 4
  n_werewolf: 2
  n_seer: 1
  n_guard: 0
  n_witch: 1
  n_hunter: 0
  n_villager: 3

agent_config:
  allow_cross_team_profiles: true
  must_include: []
  all_candidates:
    - profile_name: server_qwen35_9b
      agent_type: gpt
      backend: server_qwen35_9b
      model: "qwen3.5-9b"
      model_params:
        temperature: 1.0
        gameplay_prompt_profile: strict_classic7
        gameplay_max_tokens: 512
      sample_ratio: 1.0

pipeline:
  public_event_schema_version: classic7_public_event_sequence_v2
  raw_schema_version: classic7_pre_speech_player_suspicion_v2
  projected_schema_version: classic7_pre_speech_suspicion_pair_distribution_v2
  projection_version: classic7_player_suspicion_pair_projection_base2_v1

  collection:
    game_count: 3
    seeds: [4101, 4102, 4103]
    max_gameplay_calls_per_game: 192
    max_belief_calls_per_game: 448
    max_total_calls_per_game: 640
    max_wall_seconds_per_game: 3600.0

  project: {}

  split:
    seed: 42
    train_game_count: 1
    validation_game_count: 1
    test_game_count: 1
